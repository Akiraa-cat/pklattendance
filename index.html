<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilih Akun - Absensi Harian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-1: #f5f4f1;
            --bg-2: #ecebe6;
            --surface: rgba(255, 255, 255, 0.76);
            --surface-solid: #ffffff;
            --line: rgba(20, 19, 17, 0.09);
            --line-strong: rgba(20, 19, 17, 0.16);
            --ink: #17161a;
            --ink-soft: #726f6a;
            --ink-faint: #aba79f;
            --accent-a: #17161a;
            --accent-b: #4a4842;
            --accent-grad: linear-gradient(135deg, var(--accent-a), var(--accent-b));
            --holiday: #dc2626;
            --holiday-soft: #fef2f2;
            --success: #16a34a;
            --radius-lg: 26px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: var(--bg-1);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 14px 40px;
            position: relative;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
        }
        body::before { width: 340px; height: 340px; top: -120px; left: -100px; background: radial-gradient(circle, #d6d3ca, transparent 70%); }
        body::after { width: 300px; height: 300px; bottom: -80px; right: -90px; background: radial-gradient(circle, #dedbd2, transparent 70%); }

        .app-container { width: 100%; max-width: 440px; position: relative; z-index: 1; }

        .eyebrow {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-a);
            margin: 4px 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box { position: relative; margin-bottom: 14px; }
        .search-input {
            width: 100%; padding: 13px 16px 13px 44px;
            background: var(--surface-solid); border: 1px solid var(--line-strong);
            border-radius: var(--radius-md); font-size: 0.92rem; outline: none; color: var(--ink);
        }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }

        .accounts-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 80px; }

        .account-card {
            background: var(--surface-solid); border: 1px solid var(--line);
            border-radius: var(--radius-md); padding: 14px 16px; display: flex;
            align-items: center; justify-content: space-between; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            box-shadow: 0 4px 20px -10px rgba(23, 19, 42, 0.08);
        }
        .account-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: 0 10px 25px -12px rgba(23, 19, 42, 0.15); }

        .account-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .account-avatar {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #e5e3db;
            display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink-soft);
            flex-shrink: 0; border: 1.5px solid var(--line-strong);
        }
        .account-details { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .account-name {
            font-family: 'Space Grotesk', sans-serif; font-size: 1.02rem; font-weight: 700; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .account-status { font-size: 0.78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .status-checked { color: var(--success); }
        .status-unchecked { color: #f97316; }

        .empty-state {
            text-align: center; padding: 50px 20px; background: var(--surface-solid);
            border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--ink-soft);
        }
        .empty-state svg { color: var(--ink-faint); margin-bottom: 12px; }

        .fab-btn {
            position: fixed; bottom: 24px; right: calc(50% - 220px + 20px);
            width: 56px; height: 56px; background: var(--accent-grad); color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(23, 19, 42, 0.35); cursor: pointer; border: none; z-index: 99;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab-btn:hover { transform: scale(1.05); }
        .fab-btn:active { transform: scale(0.95); }
        @media (max-width: 480px) { .fab-btn { right: 20px; } }

        .custom-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(23, 19, 42, 0.5); z-index: 1000; backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
        }
        .custom-overlay.active { display: flex; }

        .custom-dialog {
            background: #ffffff; width: 100%; max-width: 420px; border-radius: 26px;
            padding: 26px 22px 30px; box-shadow: 0 20px 50px rgba(23, 19, 42, 0.25);
            animation: scaleIn 0.2s ease; max-height: 90vh; overflow-y: auto; position: relative;
        }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @media (max-width: 480px) {
            .custom-overlay { align-items: flex-end; }
            .custom-dialog { max-width: 100%; border-radius: 26px 26px 0 0; }
        }

        .dialog-close-x {
            position: absolute; top: 20px; right: 20px; background: #f2effe; border: none;
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--ink); z-index: 10; transition: background 0.15s;
        }
        .dialog-close-x:hover { background: #e5e0fd; }

        .dialog-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.18rem; font-weight: 700; margin-bottom: 6px; color: var(--ink); text-align: center; }
        .dialog-subtitle { font-size: 0.86rem; color: var(--ink-soft); text-align: center; margin-bottom: 20px; }

        .pin-dots-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .pin-dot {
            width: 48px; height: 48px; border: 2px solid var(--line-strong); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700;
            background: #fbfbfa; color: var(--ink); transition: border-color 0.15s, background 0.15s;
        }
        .pin-dot.filled { border-color: var(--accent-a); background: #fff; }
        .hidden-pin-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 5px; display: block; }
        .form-input {
            width: 100%; padding: 12px 14px; background: #fbfbfa; border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm); font-size: 0.92rem; color: var(--ink); outline: none;
        }
        .form-input:focus { border-color: var(--accent-a); background: #fff; }
        .help-link { font-size: 0.76rem; color: #2563eb; text-decoration: underline; cursor: pointer; margin-top: 5px; display: inline-block; }

        .btn-main {
            width: 100%; background: var(--accent-grad); color: #fff; border: none; border-radius: var(--radius-md);
            padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 8px 20px -8px rgba(23, 19, 42, 0.4);
        }
        .btn-main:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .btn-spinner {
            display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .skeleton {
            background: linear-gradient(90deg, #e9e7e2 25%, #f5f4f1 50%, #e9e7e2 75%);
            background-size: 200% 100%; animation: skeleton-loading 1.4s ease infinite; border-radius: 6px; color: transparent !important; user-select: none; pointer-events: none;
        }
        .skeleton * { visibility: hidden; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="eyebrow">
            <span>Absensi Harian · Multi Akun</span>
            <span id="accountCountLabel">0 Akun</span>
        </div>

        <div style="margin-bottom: 16px;">
            <h1 style="font-family:'Space Grotesk',sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 4px;">Pilih Akunmu</h1>
            <p style="font-size: 0.88rem; color: var(--ink-soft);">Klik akun untuk presensi atau ingatkan teman yang belum isi.</p>
        </div>

        <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari nama akun...">
        </div>

        <div id="accountsContainer" class="accounts-list"></div>

        <button type="button" class="fab-btn" id="openRegisterModalBtn" title="Daftar Akun Baru">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div id="modalOverlay" class="custom-overlay">
        <div class="custom-dialog" id="modalContentBox"></div>
    </div>

    <script>
        const SCRIPT_URL = "/api/proxy";
        const DEFAULT_PFP = "https://i.ibb.co.com/bj8dfFkL/pfp.png";

        let accountsCache = [];
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContentBox = document.getElementById('modalContentBox');
        const searchInput = document.getElementById('searchInput');
        const accountsContainer = document.getElementById('accountsContainer');
        const accountCountLabel = document.getElementById('accountCountLabel');

        async function initApp() {
            await loadAccounts();
            searchInput.addEventListener('input', renderAccountsList);
            document.getElementById('openRegisterModalBtn').addEventListener('click', openRegisterModal);

            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('user');
            if (userParam && accountsCache.length > 0) {
                const found = accountsCache.find(a => a.username.toLowerCase() === userParam.toLowerCase());
                if (found) openPinVerificationModal(found);
            }
        }

        function showCustomAlert(title, message, callback = null) {
            modalContentBox.innerHTML = `
                <button type="button" class="dialog-close-x" onclick="closeModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <h2 class="dialog-title">${title}</h2>
                <p class="dialog-subtitle" style="margin-bottom:20px;">${message}</p>
                <button type="button" class="btn-main" id="customAlertOkBtn">OK</button>
            `;
            modalOverlay.classList.add('active');
            document.getElementById('customAlertOkBtn').onclick = () => {
                closeModal();
                if (callback) callback();
            };
        }

        async function loadAccounts() {
            accountsContainer.innerHTML = `
                <div class="account-card skeleton"><div class="account-info"><div class="account-avatar"></div><div class="account-details"><div style="width:120px; height:14px;"></div><div style="width:80px; height:10px;"></div></div></div></div>
                <div class="account-card skeleton"><div class="account-info"><div class="account-avatar"></div><div class="account-details"><div style="width:100px; height:14px;"></div><div style="width:90px; height:10px;"></div></div></div></div>
            `;
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAccounts`);
                const result = await res.json();
                if (result.success && result.data && result.data.accounts) {
                    accountsCache = result.data.accounts;
                } else {
                    accountsCache = [];
                }
            } catch (err) {
                accountsCache = [];
            }
            renderAccountsList();
        }

        function renderAccountsList() {
            const query = searchInput.value.toLowerCase();
            const filtered = accountsCache.filter(a => a.username.toLowerCase().includes(query));
            
            accountCountLabel.textContent = `${accountsCache.length} Akun`;
            accountsContainer.innerHTML = '';

            if (filtered.length === 0) {
                accountsContainer.innerHTML = `
                    <div class="empty-state">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <p style="font-weight:600; margin-bottom:4px;">Belum ada akun ditemukan</p>
                        <p style="font-size:0.8rem; color:var(--ink-faint);">Tekan tombol + di pojok kanan bawah untuk mendaftarkan akun.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'account-card';
                const pfpUrl = acc.photoUrl && acc.photoUrl.trim() !== "" ? acc.photoUrl : DEFAULT_PFP;
                const statusHtml = acc.hasCheckedInToday
                    ? `<span class="account-status status-checked"><span style="width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;"></span> Sudah Presensi Hari Ini</span>`
                    : `<span class="account-status status-unchecked"><span style="width:6px;height:6px;background:#f97316;border-radius:50%;display:inline-block;"></span> Hari ini belum Presensi!</span>`;

                card.innerHTML = `
                    <div class="account-info">
                        <img class="account-avatar" src="${pfpUrl}" alt="${acc.username}">
                        <div class="account-details">
                            <span class="account-name">${acc.username}</span>
                            ${statusHtml}
                        </div>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                `;
                card.addEventListener('click', () => openPinVerificationModal(acc));
                accountsContainer.appendChild(card);
            });
        }

        function openPinVerificationModal(account) {
            const pfpUrl = account.photoUrl && account.photoUrl.trim() !== "" ? account.photoUrl : DEFAULT_PFP;
            modalContentBox.innerHTML = `
                <button type="button" class="dialog-close-x" onclick="closeModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div style="text-align:center; margin-bottom:18px;">
                    <img src="${pfpUrl}" style="width:64px; height:64px; border-radius:50%; object-fit:cover; margin-bottom:10px; border:2px solid var(--line-strong);" alt="">
                    <h2 class="dialog-title">Masukkan PIN ${account.username}</h2>
                    <p class="dialog-subtitle">Masukkan 4 digit PIN rahasia untuk masuk</p>
                </div>
                
                <div class="pin-dots-container" id="pinDotsContainer">
                    <div class="pin-dot" id="dot0"></div>
                    <div class="pin-dot" id="dot1"></div>
                    <div class="pin-dot" id="dot2"></div>
                    <div class="pin-dot" id="dot3"></div>
                </div>

                <input type="password" id="realPinInput" maxlength="4" class="hidden-pin-input" autofocus>
                <div id="pinErrorMsg" style="color:var(--holiday); font-size:0.82rem; text-align:center; margin-bottom:12px; font-weight:600; display:none;"></div>

                <button type="button" class="btn-main" id="submitPinBtn" disabled>Verifikasi PIN</button>
            `;

            modalOverlay.classList.add('active');
            const realInput = document.getElementById('realPinInput');
            const submitBtn = document.getElementById('submitPinBtn');
            const errorMsg = document.getElementById('pinErrorMsg');

            setTimeout(() => realInput.focus(), 100);
            modalContentBox.onclick = () => realInput.focus();

            let currentPinValue = "";
            const timeouts = {};

            realInput.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '').slice(0, 4);
                e.target.value = val;
                currentPinValue = val;

                for (let i = 0; i < 4; i++) {
                    const dot = document.getElementById(`dot${i}`);
                    if (i < val.length) {
                        dot.classList.add('filled');
                        if (timeouts[i]) clearTimeout(timeouts[i]);
                        dot.textContent = val[i];
                        timeouts[i] = setTimeout(() => {
                            dot.textContent = '•';
                        }, 3000);
                    } else {
                        dot.classList.remove('filled');
                        dot.textContent = '';
                        if (timeouts[i]) clearTimeout(timeouts[i]);
                    }
                }
                submitBtn.disabled = val.length !== 4;
            });

            submitBtn.addEventListener('click', async () => {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="btn-spinner"></span> Memverifikasi...';
                errorMsg.style.display = 'none';

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "verifyPin", username: account.username, pin: currentPinValue })
                    });
                    const result = await res.json();

                    if (result.success) {
                        let sessionData = result.data;
                        if (!sessionData.photoUrl || sessionData.photoUrl.trim() === "") {
                            sessionData.photoUrl = DEFAULT_PFP;
                        }
                        sessionStorage.setItem('currentSession', JSON.stringify(sessionData));
                        closeModal();
                        showCustomAlert("Berhasil Masuk!", `Selamat datang kembali, ${sessionData.username}!`, () => {
                            window.location.href = 'dashboard.html';
                        });
                    } else {
                        errorMsg.textContent = result.message || "PIN salah.";
                        errorMsg.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Verifikasi PIN";
                        realInput.value = "";
                        currentPinValue = "";
                        for(let i=0; i<4; i++) {
                            document.getElementById(`dot${i}`).classList.remove('filled');
                            document.getElementById(`dot${i}`).textContent = '';
                        }
                        realInput.focus();
                    }
                } catch (err) {
                    errorMsg.textContent = "Kesalahan koneksi server.";
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Verifikasi PIN";
                }
            });
        }

        function openRegisterModal() {
            modalContentBox.innerHTML = `
                <button type="button" class="dialog-close-x" onclick="closeModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <h2 class="dialog-title">Daftar Akun Baru</h2>
                <p class="dialog-subtitle">Daftarkan akun presensi harianmu</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="regUsername" class="form-input" placeholder="Contoh: Akiraatsuuu" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">PIN 4 Digit Angka</label>
                        <input type="password" id="regPin" class="form-input" maxlength="4" placeholder="••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Konfirmasi PIN 4 Digit</label>
                        <input type="password" id="regConfirmPin" class="form-input" maxlength="4" placeholder="••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Spreadsheet ID</label>
                        <input type="text" id="regSpreadsheetId" class="form-input" placeholder="Contoh: 1eIqk2YnJoeKmKesngMyTr..." required>
                        <span class="help-link" id="helpSpreadsheetBtn">Cara mendapatkan Spreadsheet ID?</span>
                    </div>

                    <div id="regErrorMsg" style="color:var(--holiday); font-size:0.82rem; margin-bottom:10px; font-weight:600; display:none;"></div>

                    <button type="submit" class="btn-main" id="submitRegBtn">Daftar Sekarang</button>
                </form>
            `;
            modalOverlay.classList.add('active');

            document.getElementById('helpSpreadsheetBtn').addEventListener('click', openHelpSpreadsheetModal);

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const pin = document.getElementById('regPin').value.trim();
                const confirmPin = document.getElementById('regConfirmPin').value.trim();
                const spreadsheetId = document.getElementById('regSpreadsheetId').value.trim();
                const photoUrl = DEFAULT_PFP;
                const errorMsg = document.getElementById('regErrorMsg');

                if (pin !== confirmPin) {
                    errorMsg.textContent = "Konfirmasi PIN tidak cocok.";
                    errorMsg.style.display = 'block';
                    return;
                }
                if (pin.length !== 4) {
                    errorMsg.textContent = "PIN harus tepat 4 digit angka.";
                    errorMsg.style.display = 'block';
                    return;
                }

                const submitBtn = document.getElementById('submitRegBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = "Mendaftarkan...";

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "registerAccount", username, pin, spreadsheetId, photoUrl })
                    });
                    const result = await res.json();
                    if (result.success) {
                        closeModal();
                        showCustomAlert("Berhasil!", "Akun berhasil didaftarkan! Silakan pilih akun Anda untuk login.", async () => {
                            await loadAccounts();
                        });
                    } else {
                        errorMsg.textContent = result.message || "Gagal registrasi.";
                        errorMsg.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Daftar Sekarang";
                    }
                } catch (err) {
                    errorMsg.textContent = "Kesalahan koneksi server.";
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Daftar Sekarang";
                }
            });
        }

        function openHelpSpreadsheetModal() {
            modalContentBox.innerHTML = `
                <button type="button" class="dialog-close-x" onclick="openRegisterModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <h2 class="dialog-title">Panduan Spreadsheet ID</h2>
                <p class="dialog-subtitle" style="text-align:left; margin-bottom:14px; line-height:1.6;">Cara mendapatkan Spreadsheet ID untuk akun Anda:</p>
                <ol style="text-align:left; font-size:0.88rem; color:var(--ink-soft); padding-left:20px; line-height:1.7; margin-bottom:20px;">
                    <li>Buat Google Spreadsheet baru di Google Drive Anda.</li>
                    <li>Perhatikan URL spreadsheet di browser:<br>
                        <code style="background:#f1f0ec; padding:2px 6px; border-radius:4px; font-size:0.8rem; word-break:break-all;">https://docs.google.com/spreadsheets/d/<b>[SPREADSHEET_ID]</b>/edit</code>
                    </li>
                    <li>Salin teks di antara huruf <b>/d/</b> dan kata <b>/edit</b>.</li>
                    <li>Tempelkan teks tersebut ke kolom Spreadsheet ID saat mendaftar.</li>
                </ol>
                <button type="button" class="btn-main" onclick="openRegisterModal()">Mengerti, Kembali</button>
            `;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
